[project]
name = "AlphaQuant"
version = "0.1.0"
description = "AlphaQuant: Agent-Optimized Quantitative Investment System"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
# 与 requirements.txt 保持一致（安装以 requirements.txt 钉死版本为准，此处为下界镜像）
dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tushare>=1.4.0",
    "akshare>=1.18.0",
    "openai>=3.0.0",
    "loguru>=0.7.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
# legacy 模块（src/backtest、streamlit 仪表盘等已下线功能）按需安装
legacy = ["redis>=4.0.0", "backtrader>=1.9.78.123", "streamlit>=1.30.0",
          "pymupdf4llm>=0.0.10"]
requires-python = ">=3.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
